name: Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  plugin:
    name: nsJSON / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: msvc, os: windows-latest, release: true }
          - { toolchain: mingw, os: ubuntu-latest, release: false }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: nsis-dev/build-plugin@main
        with:
          name: nsJSON
          toolchain: ${{ matrix.toolchain }}
          release: ${{ matrix.release }}
          sources: |
            Contrib/nsJSON/JSON.c
            Contrib/nsJSON/LinkedList.c
            Contrib/nsJSON/nsJSON.c
            Contrib/nsJSON/nsJSON.rc
          targets: x86-ansi,x86-unicode,amd64-unicode
